[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Inclure ffmpeg-static dans les fonctions serverless (Linux en prod)
[functions]
  included_files = ["node_modules/ffmpeg-static/**"]
  node_bundler = "esbuild"

# Timeout génération images (Gemini + compression)
[functions."*"]
  timeout = 60
